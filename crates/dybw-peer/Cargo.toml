[package]
name = "dybw-peer"
description = "The platform layer: who is on the other end of a Unix socket, and the secret clipboard (the only crate with unsafe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The one crate allowed unsafe: the rest of the workspace forbids it.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "deny"

[features]
# A scripted ProcessSource for the tests of the crates above this one.
fake = []

[dependencies]
libc.workspace = true
thiserror.workspace = true

# The clipboard tools' content hash and wiped buffers (Linux only; the tests run them everywhere).
[target.'cfg(target_os = "linux")'.dependencies]
sha2.workspace = true
zeroize.workspace = true

# The pasteboard through typed bindings: no unsafe needed for the calls made.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[dev-dependencies]
sha2.workspace = true
zeroize.workspace = true
tempfile.workspace = true
