# Tag pushes only: build dybw and dybw-agent, then publish them as a GitHub release.
# No caches anywhere in this workflow, so a release can never pick up a poisoned build cache.
# Asset names are documented in docs/install.md; the dotfiles download them by name, so keep them stable.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: static binary (${{ matrix.arch }}-linux-musl)
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Alpine builds against musl natively; the result is a fully static binary. A plain `docker run`, not a job
      # container: GitHub runs no JavaScript action (checkout, upload) inside an Alpine container on arm64.
      - name: Build and package
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          docker run --rm -e ARCH -e TAG -v "$PWD":/src -w /src rust:1-alpine sh -euc '
            apk add --no-cache musl-dev file
            cargo build --locked --release
            version="${TAG#v}"
            for bin in dybw dybw-agent; do
              file "target/release/$bin" | tee /dev/stderr | grep -q "static"
            done
            # The tag and the crate version must agree, or the asset name would lie.
            test "$(target/release/dybw --version)" = "dybw $version"
            name="dybw-$version-$ARCH-linux-musl.tar.gz"
            mkdir -p stage dist
            cp target/release/dybw target/release/dybw-agent stage/
            cp -R contrib README.md LICENSE stage/
            tar -C stage -czf "dist/$name" dybw dybw-agent contrib README.md LICENSE
            cd dist && sha256sum "$name" > "$name.sha256"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dybw-${{ matrix.arch }}-linux-musl
          path: dist/

  macos:
    name: macOS arm64
    # The Swift shim (crates/dybw-peer/build.rs) builds with the runner's Xcode swiftc.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo build --locked --release
          version="${TAG#v}"
          test "$(target/release/dybw --version)" = "dybw $version"
          name="dybw-$version-aarch64-apple-darwin.tar.gz"
          mkdir -p stage dist
          cp target/release/dybw target/release/dybw-agent stage/
          cp -R contrib README.md LICENSE stage/
          tar -C stage -czf "dist/$name" dybw dybw-agent contrib README.md LICENSE
          cd dist && shasum -a 256 "$name" > "$name.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dybw-aarch64-apple-darwin
          path: dist/

  release:
    name: GitHub release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          # A tag with a pre-release part (v1.0.0-rc.1) is marked prerelease.
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          notes='The macOS build is not signed or notarized. Download it with curl, or clear the quarantine attribute (xattr -d com.apple.quarantine). Asset names and verification: docs/install.md.'
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "dybw $TAG" \
            --notes "$notes" --generate-notes --verify-tag "${prerelease[@]}"
