[workspace]
members = ["crates/dybw-proto", "crates/dybw-peer", "crates/dybw-agent", "crates/dybw"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

[workspace.dependencies]
# Pinned by rev on its public URL, like bwss.
dybw-core = { git = "https://gitlab.com/dynamo-tools/dybw-core.git", rev = "3088ceb5f93d9470716235cfe238acde5d177799" }
dybw-native = { git = "https://gitlab.com/dynamo-tools/dybw-core.git", rev = "3088ceb5f93d9470716235cfe238acde5d177799" }
dybw-proto = { path = "crates/dybw-proto" }
dybw-peer = { path = "crates/dybw-peer" }
dybw-agent = { path = "crates/dybw-agent" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2.191"
thiserror = "2.0.21"
anyhow = "1.0.104"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = { version = "1.9.1", features = ["derive", "serde"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1.44"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "fs", "system"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi"] }

# PBKDF2 and Argon2 in the unlock tests run at the speed of a release build.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
overflow-checks = true
lto = "thin"
strip = true
