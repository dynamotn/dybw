[workspace]
members = ["crates/dybw-proto", "crates/dybw-agent", "crates/dybw"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

[workspace.dependencies]
# Pinned by rev on its public URL, like bwss. TODO(P4.1): re-pin to a rev that has dybw-native and add it here.
dybw-core = { git = "https://gitlab.com/dynamo-tools/dybw-core.git", rev = "928e7f999a8cbc6ef4ae44e2438e182507e8bea6" }
dybw-proto = { path = "crates/dybw-proto" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[profile.release]
overflow-checks = true
lto = "thin"
strip = true
